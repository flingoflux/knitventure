openapi: 3.1.0
info:
  title: Knitventure API
  version: 0.1.0
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Read the backend build status
      security: []
      responses:
        '200':
          description: The backend is reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - commitId
                properties:
                  commitId:
                    type: string
                    pattern: '^(local|[0-9a-f]{40})$'
