name: Frontend image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/flingoflux/knitventure
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: knitventure-frontend:ci
          labels: |
            org.opencontainers.image.source=https://github.com/flingoflux/knitventure
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Caddy and check HTTP delivery
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm knitventure-frontend:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          container=$(docker run --rm -d -p 127.0.0.1:8080:80 knitventure-frontend:ci)
          trap 'docker stop "$container"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ -o /tmp/index.html
          grep -q 'Willkommen bei Knitventure' /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/direkter-aufruf -o /tmp/fallback.html
          cmp /tmp/index.html /tmp/fallback.html
          python3 - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          html = Path('/tmp/index.html').read_text()
          assets = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html)
          assert any(asset.endswith('.js') for asset in assets)
          assert any(asset.endswith('.css') for asset in assets)
          for asset in assets:
              with urllib.request.urlopen('http://127.0.0.1:8080/' + asset, timeout=5) as response:
                  assert response.status == 200
                  assert 'text/html' not in response.headers['Content-Type']
                  assert response.read()
          PY

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag knitventure-frontend:ci "$IMAGE:$COMMIT_SHA"
          docker push "$IMAGE:$COMMIT_SHA"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: knitventure-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out SSH host key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy published image
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_KEY: ${{ secrets.KNITVENTURE_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "main has moved to $current_sha. Skipping $GITHUB_SHA."
            exit 0
          fi

          key_file=$(mktemp)
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          ssh -n -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts \
            -o ConnectTimeout=10 root@138.201.187.224 "$GITHUB_SHA"
