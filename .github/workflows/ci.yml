name: Build and deploy Knitventure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      FRONTEND_IMAGE: ghcr.io/flingoflux/knitventure
      BACKEND_IMAGE: ghcr.io/flingoflux/knitventure-backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: knitventure-frontend:ci
          labels: |
            org.opencontainers.image.source=https://github.com/flingoflux/knitventure
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Maven tests
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_21_X64" mvn -B -ntp -f backend/pom.xml verify

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: knitventure-backend:ci
          build-args: KNITVENTURE_COMMIT_ID=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/flingoflux/knitventure
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Validate OpenAPI and check the Compose stack
        env:
          KNITVENTURE_IMAGE_TAG: ci
          KNITVENTURE_FRONTEND_IMAGE: knitventure-frontend
          KNITVENTURE_BACKEND_IMAGE: knitventure-backend
          KNITVENTURE_HTTP_BIND: 127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/knitventure-ci"
          python="$RUNNER_TEMP/knitventure-ci/bin/python"
          "$python" -m pip install -r scripts/requirements-ci.txt
          "$python" scripts/check-stack.py
          docker run --rm knitventure-frontend:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          trap 'docker compose -f deploy/compose.yaml down -v' EXIT
          docker compose -f deploy/compose.yaml up -d --pull never
          "$python" scripts/check-stack.py http://127.0.0.1:8080

      - name: Verify deployment rollback
        run: bash scripts/check-rollback.sh knitventure-frontend:ci knitventure-backend:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish both tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag knitventure-frontend:ci "$FRONTEND_IMAGE:$COMMIT_SHA"
          docker tag knitventure-backend:ci "$BACKEND_IMAGE:$COMMIT_SHA"
          docker push "$FRONTEND_IMAGE:$COMMIT_SHA"
          docker push "$BACKEND_IMAGE:$COMMIT_SHA"

      - name: Verify public image access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$FRONTEND_IMAGE:$GITHUB_SHA" >/dev/null
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$BACKEND_IMAGE:$GITHUB_SHA" >/dev/null

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: knitventure-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out SSH host key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify this is still the main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "main has moved to $current_sha. Skipping $GITHUB_SHA."
            exit 0
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Join the Knitventure tailnet
        if: steps.main.outputs.deploy == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:knitventure-ci
          ping: 100.124.224.112

      - name: Deploy published images
        if: steps.main.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.KNITVENTURE_TAILSCALE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file=$(mktemp)
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          ssh -n -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/known_hosts \
            -o ConnectTimeout=10 knitventure-deploy@100.124.224.112 "$GITHUB_SHA"
